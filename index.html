<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPCAR OS: TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;600;800&display=swap');
        
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --dark-bg: #030712; }
        body { background-color: var(--dark-bg); color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        
        .glass-militar { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .neon-glow { text-shadow: 0 0 10px var(--neon-blue); }
        .neon-border-blue { border: 1px solid rgba(0, 242, 255, 0.3); }
        .neon-border-pink { border: 1px solid rgba(252, 76, 175, 0.3); }

        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 800; color: #64748b; }
        .nav-tab.active { color: var(--neon-blue); }

        input[type="range"] { accent-color: var(--neon-blue); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [tab, setTab] = useState('DASHBOARD');
            const [xp, setXp] = useState(1250);

            const LINKS = {
                MAT: "https://www.youtube.com/c/pypereira",
                PORT: "https://www.youtube.com/playlist?list=PLPshpUunK4GOf_9Wp_vB_W_K5Yis_8P6W",
                ING: "https://www.youtube.com/user/bbclearningenglish"
            };

            // --- COMPONENTES DE INTERFACE ---

            const Header = () => (
                <div className="p-6 flex justify-between items-end bg-gradient-to-b from-blue-950/20 to-transparent">
                    <div>
                        <h1 className="font-tech text-xl tracking-widest neon-glow">EPCAR.OS</h1>
                        <p className="text-[10px] font-black opacity-40 uppercase tracking-widest">Protocolo de Elite</p>
                    </div>
                    <div className="text-right">
                        <span className="text-[10px] font-bold text-sky-400 block">LEVEL 14</span>
                        <span className="font-tech text-lg">XP {xp}</span>
                    </div>
                </div>
            );

            const Dashboard = () => (
                <div className="p-4 space-y-6 animate-in fade-in duration-500">
                    <div className="glass-militar p-5 rounded-3xl neon-border-blue">
                        <h2 className="font-tech text-[10px] text-sky-400 mb-4">MISSÃO ATUAL</h2>
                        <div className="flex items-center gap-4">
                            <div className="h-16 w-16 rounded-2xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-2xl">⚡</div>
                            <div>
                                <h3 className="font-800 text-lg leading-tight">Simulado 48Q</h3>
                                <p className="text-xs text-slate-400">Status: Disponível (Sábado)</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="glass-militar p-4 rounded-3xl border-l-2 border-l-purple-500">
                            <span className="text-[8px] font-black opacity-50 block mb-1">BIBLIOTECA</span>
                            <a href={LINKS.MAT} target="_blank" className="text-xs font-bold block mb-2">Matemática ▶</a>
                            <a href={LINKS.PORT} target="_blank" className="text-xs font-bold block">Português ▶</a>
                        </div>
                        <div className="glass-militar p-4 rounded-3xl border-l-2 border-l-pink-500">
                            <span className="text-[8px] font-black opacity-50 block mb-1">FISICO (TACF)</span>
                            <p className="text-[10px] font-bold">Corrida: 2.4km</p>
                            <p className="text-[10px] font-bold">Flexão: 30 rep</p>
                        </div>
                    </div>

                    <div className="space-y-3">
                         <h2 className="font-tech text-[10px] text-slate-500 px-2 tracking-[4px]">CALENDÁRIO TÁTICO</h2>
                         {['SEG: MAT / ING', 'TER: PORT / MAT', 'QUA: GEO / ING', 'QUI: SIN / MAT', 'SEX: RED / ING'].map((dia, i) => (
                             <div key={i} className="flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5">
                                 <span className="text-xs font-black">{dia}</span>
                                 <div className="h-2 w-2 rounded-full bg-sky-500 shadow-[0_0_8px_#0ea5e9]"></div>
                             </div>
                         ))}
                    </div>
                </div>
            );

            const Redacao = () => (
                <div className="p-6 space-y-6 animate-in slide-in-from-bottom-10">
                    <h2 className="font-tech text-sky-400 text-center text-sm">AVALIADOR DE REDAÇÃO</h2>
                    <div className="glass-militar p-6 rounded-3xl space-y-4">
                        <textarea className="w-full h-64 bg-transparent border-none outline-none text-sm leading-relaxed" placeholder="Cole seu texto aqui para análise de critérios..."></textarea>
                    </div>
                    <div className="space-y-4">
                        <div className="text-[10px] font-bold flex justify-between"><span>COERÊNCIA</span><span>8/10</span></div>
                        <div className="h-1.5 w-full bg-white/10 rounded-full overflow-hidden">
                            <div className="h-full bg-sky-500 w-[80%]"></div>
                        </div>
                        <button onClick={() => setXp(xp + 50)} className="w-full py-4 rounded-2xl bg-sky-500 text-black font-900 text-xs tracking-widest">SALVAR E GANHAR XP</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-24">
                    <Header />
                    
                    {tab === 'DASHBOARD' && <Dashboard />}
                    {tab === 'REDACAO' && <Redacao />}
                    {tab === 'TACF' && <div className="p-10 text-center font-tech opacity-20">TREINO FÍSICO CARREGANDO...</div>}

                    {/* BARRA DE NAVEGAÇÃO IPHONE STYLE */}
                    <nav className="fixed bottom-6 left-4 right-4 h-16 glass-militar rounded-3xl flex items-center px-4 neon-border-blue">
                        <button onClick={() => setTab('DASHBOARD')} className={`nav-tab ${tab === 'DASHBOARD' ? 'active' : ''}`}>
                            <span className="text-xl">📊</span>
                            DASH
                        </button>
                        <button onClick={() => setTab('REDACAO')} className={`nav-tab ${tab === 'REDACAO' ? 'active' : ''}`}>
                            <span className="text-xl">✍️</span>
                            RED
                        </button>
                        <button onClick={() => setTab('TACF')} className={`nav-tab ${tab === 'TACF' ? 'active' : ''}`}>
                            <span className="text-xl">🪖</span>
                            TACF
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
